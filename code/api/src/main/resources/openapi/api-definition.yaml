openapi: 3.0.1
info:
  title: Tenpo Challenge API
  description: |-
    This is Tenpo Challenge backend rest api specification
  termsOfService: http://swagger.io/terms/
  contact:
    email: alejoicecream@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: https://localhost:8080/
tags:
  - name: mathOperations
    description: Math Operations
  - name: transactions
    description: Api transactions history

paths:
  /math-operation/addition:
    get:
      tags:
        - mathOperations
      summary: Math operation to add two numbers
      operationId: mathAddition
      parameters:
        - in: query
          name: num1
          description: First number to be added
          required: true
          schema:
            type: integer
            format: int64
            example: 7
        - in: query
          name: num2
          description: Second number to be added
          required: true
          schema:
            type: integer
            format: int64
            example: 9
      responses:
        '200':
          description: Addition result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionResponse'
        '400':
          description: Bad request
        '404':
          description: Endpoint not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"

  /transaction/history:
    get:
      tags:
        - transactions
      summary: Get Paginated transactions history
      operationId: transactionsHistory
      parameters:
        - name: offset
          in: query
          required: true
          schema:
            type: integer
            default: 0
            example: 0
          description: Index of the page to return
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            default: 10
            example: 10
          description: Maximum number of items per page
      responses:
        '200':
          description: Transactions history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionResponse'
        '400':
          description: Bad request
        '404':
          description: Endpoint not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseError"
components:
  schemas:
    Transaction:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        creationDate:
          type: string
          format: date-time
          example: "2023-10-01T12:00:00Z"
        endpoint:
          type: string
          example: "/v1/addition"
        parameters:
          type: string
          example: "{\"num1\":7,\"num2\":9}"
        response:
          type: string
          example: "{\"value\":14}"
    NextPageInfo:
      type: object
      properties:
        offset:
          description: Index of the next page
          type: integer
          example: 1
        limit:
          description: Maximum number of items per page
          type: integer
          example: 10
        total:
          description: Total number of pages available
          type: integer
          example: 5
    AdditionResponse:
      type: object
      properties:
        result:
          type: number
          format: double
          example: 14.50
    PaginatedTransactionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        nextPageInfo:
            $ref: '#/components/schemas/NextPageInfo'
    ApiResponseError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
