spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: db_user
    password: db_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  cache:
    cache-names: percentageApiCache
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

  docker:
    compose:
      enabled: true
      file: src/main/resources/compose/docker-compose.yml
      lifecycle-management: start_and_stop
      startup:
          timeout: 60s
      skip:
        in-tests: false

properties:
  external-api:
    percentage-api:
      host: http://localhost:1080
      path: /getpercentage

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: Challenge API
    version: 1.0.0
    description: API documentation for the challenge project
